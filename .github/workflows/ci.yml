name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production client, SSR & standalone server bundles
        run: npm run server:build

  build-windows:
    name: Windows Build, Test & Smoke Check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Run TypeScript typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Run unit tests
        shell: pwsh
        run: npm test

      - name: Build portable Windows release
        shell: pwsh
        run: npm run build:win

      - name: Verify release artifacts and smoke-test OcarinaAtlas.exe
        shell: pwsh
        run: ./scripts/smoke-test-win.ps1 -Port 34567

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [verify, build-windows]
    if: always()
    steps:
      - name: Check required jobs succeeded
        shell: bash
        run: |
          if [ "${{ needs.verify.result }}" != "success" ] || [ "${{ needs.build-windows.result }}" != "success" ]; then
            echo "CI Gate failed: verify=${{ needs.verify.result }}, build-windows=${{ needs.build-windows.result }}"
            exit 1
          fi
          echo "All CI verification jobs succeeded."
