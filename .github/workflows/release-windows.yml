name: Release Windows Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Build & Verify Windows x64 Portable ZIP
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Detect release refs and configured AI summary provider
        id: release-meta
        shell: pwsh
        env:
          HAS_COPILOT: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          REF_NAME_INPUT: ${{ github.ref_name }}
        run: |
          function Assert-SafeGitRef([string]$Value, [string]$Label) {
            if ([string]::IsNullOrWhiteSpace($Value)) {
              return ""
            }
            $trimmed = $Value.Trim()
            if ($trimmed -match '[\r\n\t\x00-\x1f\x7f]' -or $trimmed.StartsWith('-') -or $trimmed.Contains('..') -or $trimmed.Contains('@{') -or $trimmed -notmatch '^[A-Za-z0-9._/+-]+$') {
              throw "Unsafe characters in $Label."
            }
            return $trimmed
          }

          $rawHeadRef = if ([string]::IsNullOrWhiteSpace($env:REF_NAME_INPUT)) { "HEAD" } else { $env:REF_NAME_INPUT }
          $headRef = Assert-SafeGitRef -Value $rawHeadRef -Label "head_ref"

          $prevTagRaw = git describe --tags --abbrev=0 --match "v*" "$headRef^" 2>$null
          $prevTag = ""
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($prevTagRaw)) {
            $prevTag = Assert-SafeGitRef -Value $prevTagRaw -Label "prev_tag"
          }

          $copilotBase = $prevTag
          if ([string]::IsNullOrWhiteSpace($copilotBase)) {
            $firstCommit = (git rev-list --max-parents=0 HEAD | Select-Object -First 1)
            $copilotBase = Assert-SafeGitRef -Value $firstCommit -Label "copilot_base_ref"
          }

          $provider = "none"
          if ($env:HAS_COPILOT -eq "true") {
            $provider = "copilot"
          } elseif ($env:HAS_GEMINI -eq "true") {
            $provider = "gemini"
          } elseif ($env:HAS_OPENAI -eq "true") {
            $provider = "openai"
          }

          "head_ref=$headRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prev_tag=$prevTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "copilot_base_ref=$copilotBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "provider=$provider" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Run TypeScript typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Run unit tests
        shell: pwsh
        run: npm test

      - name: Build portable Windows release
        shell: pwsh
        run: npm run build:win

      - name: Verify release artifacts and smoke-test HyruleAtlas.exe
        shell: pwsh
        run: ./scripts/smoke-test-win.ps1 -Port 34568

      - name: Generate AI release notes with GitHub Copilot (optional)
        id: copilot-notes
        if: steps.release-meta.outputs.provider == 'copilot' && steps.release-meta.outputs.copilot_base_ref != '' && steps.release-meta.outputs.copilot_base_ref != steps.release-meta.outputs.head_ref
        continue-on-error: true
        uses: github/copilot-release-notes@29ba181a86b88f3acee62a03369033edfa982ab9 # v1.0.3
        with:
          base-ref: ${{ steps.release-meta.outputs.copilot_base_ref }}
          head-ref: ${{ steps.release-meta.outputs.head_ref }}
          instructions: .github/release-notes-instructions.md
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Copilot output for release body composer
        if: steps.copilot-notes.outcome == 'success'
        shell: pwsh
        env:
          COPILOT_OUTPUT: ${{ steps.copilot-notes.outputs.release-notes }}
        run: |
          $copilotPath = Join-Path $env:RUNNER_TEMP "copilot-notes.md"
          if (-not [string]::IsNullOrWhiteSpace($env:COPILOT_OUTPUT)) {
            $env:COPILOT_OUTPUT | Out-File -FilePath $copilotPath -Encoding utf8
          }

      - name: Compose release notes & checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HEAD_REF: ${{ steps.release-meta.outputs.head_ref }}
          PREVIOUS_TAG: ${{ steps.release-meta.outputs.prev_tag }}
          BUILD_REF: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COPILOT_NOTES_FILE: ${{ runner.temp }}/copilot-notes.md
          ZIP_PATH: release/HyruleAtlas-Windows-x64.zip
          OUT_PATH: release/RELEASE_NOTES.md
        run: |
          node scripts/generate-release-notes.mjs
          if (Test-Path release/RELEASE_NOTES.md) {
            Get-Content release/RELEASE_NOTES.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HyruleAtlas-Windows-x64
          path: release/HyruleAtlas-Windows-x64.zip
          if-no-files-found: error

      - name: Upload composed release notes artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release/RELEASE_NOTES.md
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: package-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows portable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: HyruleAtlas-Windows-x64
          path: release-artifacts

      - name: Download release notes artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Hyrule Atlas ${{ github.ref_name }}
          files: release-artifacts/HyruleAtlas-Windows-x64.zip
          body_path: release-artifacts/RELEASE_NOTES.md
          generate_release_notes: false

      - name: Verify published GitHub Release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPO" --json tagName,name,assets --jq '{tagName, name, assetCount: (.assets | length)}'
