name: Release Windows Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Build & Publish Windows x64 Portable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Run TypeScript typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Run unit tests
        shell: pwsh
        run: npm test

      - name: Build portable Windows release
        shell: pwsh
        run: npm run build:win

      - name: Verify release artifacts and smoke-test OcarinaMaps.exe
        shell: pwsh
        run: ./scripts/smoke-test-win.ps1 -Port 34568

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OcarinaMaps-Lichii-Windows-x64
          path: release/OcarinaMaps-Lichii-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/OcarinaMaps-Lichii-Windows-x64.zip
          generate_release_notes: true
